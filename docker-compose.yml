# ============================================================
# XCEREBRO 2.0 — DOCKER COMPOSE (LOCAL DEVELOPMENT)
# ============================================================
# This compose file is for LOCAL TESTING ONLY.
# For production, use the Railway one-click templates.
# See docs/02-railway-deploy.md for the production deployment.
# ============================================================
#
# Usage:
#   1. cp .env.example .env  (and fill in your keys)
#   2. docker compose up -d
#   3. Wait ~3 minutes for all services to be healthy
#   4. Access:
#      - n8n:    http://localhost:5678
#      - Dify:   http://localhost (port 80)
#      - Crew:   http://localhost:8000
#      - Postiz: http://localhost:5000
# ============================================================

version: '3.8'

services:
  # ---------- POSTGRES (shared by everything) ----------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xcerebro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_env}
      POSTGRES_DB: xcerebro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xcerebro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [xcerebro]

  # ---------- REDIS (job queues for n8n + Dify) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [xcerebro]

  # ---------- N8N (workflow automation) ----------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-xcerebro}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_env}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Chicago}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-please_change_me_to_random_string}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [xcerebro]

  # ---------- DIFY API ----------
  dify-api:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-please_change_me_to_random_string_42_chars_minimum}
      - DB_USERNAME=${POSTGRES_USER:-xcerebro}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/api/storage
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [xcerebro]

  # ---------- DIFY WORKER ----------
  dify-worker:
    image: langgenius/dify-api:latest
    restart: unless-stopped
    environment:
      - MODE=worker
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-please_change_me_to_random_string_42_chars_minimum}
      - DB_USERNAME=${POSTGRES_USER:-xcerebro}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      - dify-api
    networks: [xcerebro]

  # ---------- DIFY WEB ----------
  dify-web:
    image: langgenius/dify-web:latest
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=
      - APP_API_URL=
    networks: [xcerebro]

  # ---------- WEAVIATE (vector DB for Dify RAG) ----------
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks: [xcerebro]

  # ---------- DIFY SANDBOX (safe code execution) ----------
  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    restart: unless-stopped
    environment:
      - API_KEY=${DIFY_SANDBOX_API_KEY:-dify-sandbox-key-change-me}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
    networks: [xcerebro]

  # ---------- NGINX (Dify reverse proxy) ----------
  dify-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dify-configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dify-api
      - dify-web
    networks: [xcerebro]

  # ---------- POSTIZ (social media scheduler) ----------
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-xcerebro}:${POSTGRES_PASSWORD:-changeme_in_env}@postgres:5432/postiz
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${POSTIZ_JWT_SECRET:-please_change_me_to_random_string}
      - FRONTEND_URL=${POSTIZ_FRONTEND_URL:-http://localhost:5000}
      - NEXT_PUBLIC_BACKEND_URL=${POSTIZ_BACKEND_URL:-http://localhost:5000/api}
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - IS_GENERAL=true
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
    ports:
      - "5000:5000"
    volumes:
      - postiz_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [xcerebro]

  # ---------- CREWAI AGENT RUNTIME (this app) ----------
  crew:
    build:
      context: ./crew
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-xcerebro}:${POSTGRES_PASSWORD:-changeme_in_env}@postgres:5432/crew
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./agents:/app/agents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [xcerebro]

networks:
  xcerebro:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  dify_storage:
  weaviate_data:
  postiz_uploads:
