---
# ============================================================
# CREW: DAILY KPI BRIEF
# ============================================================
# The simplest autonomous flow. Runs every morning at 6am.
# CFO pulls revenue numbers, CMO summarizes content metrics,
# CEO synthesizes the brief, posts to operator's Slack.
#
# Proof-of-life flow. First thing buyers activate after deploy.
# ============================================================

id: daily-kpi-brief
name: "Daily KPI Brief"
description: >
  Every morning at 6am local time, this crew runs to summarize the
  business state and surface the day's priorities. Output lands in
  Slack before the operator wakes up.

triggers_for_workflows:
  - daily-kpi-brief  # n8n workflow that triggers this
  - morning-brief

# Members of this crew (must reference loaded agent IDs)
members:
  - agent_id: auto-cfo
    role: "Pull revenue, expenses, and cash flow for the last 24 hours and 7 days"
    can_delegate: false
  - agent_id: auto-project-manager
    role: "Pull ClickUp state: quarterly rocks status, past-due tasks, open tasks by project"
    can_delegate: false
  - agent_id: auto-sales-manager
    role: "Pull pipeline state: new leads, calls booked, calls completed, deals closed"
    can_delegate: false
  - agent_id: auto-ceo
    role: "Synthesize all reports into the daily EOS brief with rock status and priorities"
    can_delegate: true

# Whether to run hierarchically (CEO directs) or sequentially (chain)
hierarchical: false

# Tasks (run sequentially in this order)
tasks:
  - id: cfo_pull
    agent_id: auto-cfo
    description: >
      Pull revenue, expenses, and cash flow data for the last 24 hours and
      the last 7 days. Format as a concise summary: 3-4 bullet points max.
      Flag any anomalies (refunds, failed payments, unusual spend).
    expected_output: "A concise CFO snapshot in 3-4 bullet points."

  - id: clickup_pull
    agent_id: auto-project-manager
    description: >
      Pull the ClickUp state. First: the "Quarterly Rocks" list in the EOS
      space — every rock with owner, status, and due date. Second: all open
      tasks across the workspace — flag anything PAST DUE (include how many
      days overdue and the assignee). Third: tasks completed in the last
      24 hours. Be precise: real task names, real dates, real assignees.
    expected_output: >
      Rocks list with status per rock+owner; past-due list with days overdue
      and assignee; completions in the last 24h.

  - id: sales_pull
    agent_id: auto-sales-manager
    description: >
      Pull pipeline state: new leads in the last 24h, calls booked,
      calls completed, deals closed. Flag any hot leads that need
      immediate attention. Identify the bottleneck stage.
    expected_output: "A concise Sales Manager snapshot with hot lead flags."

  - id: ceo_synthesize
    agent_id: auto-ceo
    description: >
      Synthesize the CFO, Project Manager, and Sales Manager reports into the
      DAILY EOS BRIEF. Sections, in order:
      1. ROCKS — one line per quarterly rock: name, owner, on-track/off-track.
      2. PAST DUE — every overdue item with owner and days overdue. Name names.
      3. TOP 3 TODAY — priorities reasoned from the V/TO (injected in your
         context) and the fastest realistic path to income. Tie each to a rock
         or V/TO element.
      4. MISSING — tasks/actions the plan implies but nobody has created yet.
      5. DATA BASIS — one line stating what data this brief is grounded in
         (e.g., "ClickUp metadata + GHL pipeline; no financial data in
         RehabBooks yet"). Never present reasoning as measurement.
      On Mondays, expand section 1 into the full L10 scorecard format.
      Keep total output under 400 words. Format with Slack-friendly headers.
    expected_output: "The daily EOS brief: rocks, past-due, top-3, missing items, data basis. Under 400 words."

# Output destination
output:
  destination: slack
  channel: "{SLACK_NOTIFICATIONS_CHANNEL_ID}"
  format: markdown
